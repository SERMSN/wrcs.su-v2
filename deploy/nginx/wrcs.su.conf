# /etc/nginx/sites-available/wrcs.su
#
# Host PHP-FPM deployment (no container in production).
# The GitHub Actions workflow uploads Laravel into /var/www/wrcs.su.
#
# Install:
#   sudo install -m 644 deploy/nginx/wrcs.su.conf /etc/nginx/sites-available/wrcs.su
#   sudo ln -sfn /etc/nginx/sites-available/wrcs.su /etc/nginx/sites-enabled/wrcs.su
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name wrcs.su www.wrcs.su;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wrcs.su www.wrcs.su;

    root /var/www/wrcs.su/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/wrcs.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wrcs.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
